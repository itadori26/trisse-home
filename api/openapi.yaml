openapi: 3.1.0
info:
  title: trisse-home API
  version: 1.0.0
  summary: JSON API of trisse-home, a self-hosted personal start page.
  description: |
    All endpoints below `/api/` except the ones marked as public require a
    session cookie (`trisse_session`, or `__Host-trisse_session` when
    `COOKIE_SECURE=true`). State-changing requests (POST, PUT, PATCH, DELETE)
    additionally require the session's CSRF token in the `X-CSRF-Token`
    header; it is returned by login, setup and `GET /api/auth/status`.
    Cross-site requests are rejected (Sec-Fetch-Site / Origin checks).

    Errors use a common envelope (`ErrorBody`). Validation errors are
    returned as 422 with the offending `field`.

    Endpoints of modules disabled via `MODULES_DISABLED` return 404.
  license:
    name: MIT
servers:
  - url: http://localhost:8090
security:
  - session: []
  - apiToken: []
tags:
  - name: auth
  - name: backup
  - name: onboarding
  - name: dashboard
  - name: appearance
  - name: search
  - name: weather
  - name: services
  - name: bookmarks
  - name: notes
  - name: todos
  - name: rss
  - name: system
  - name: docker
  - name: adguard
  - name: calendar
  - name: platform

paths:
  /healthz:
    get:
      tags: [platform]
      summary: Health check (database reachable)
      security: []
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: Database unavailable }
  /api/modules:
    get:
      tags: [platform]
      summary: Enabled modules and widget kinds
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModulesInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- auth
  /api/auth/status:
    get:
      tags: [auth]
      summary: Setup and login state of the caller (public)
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatus" } } } }
  /api/auth/setup:
    post:
      tags: [auth]
      summary: Create the account with the setup token from the server log (public)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetupRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { description: Invalid setup token, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: Already set up, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/demo:
    post:
      tags: [auth]
      summary: Password-less login, only routed when DEMO_MODE=true (see docs/demo.md); /api/auth/status reports demo=true
      security: []
      responses: { "200": { description: Session started }, "404": { description: Not a demo instance } }
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in (public, rate limited per client IP)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Setup required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Logged out }
  /api/auth/password:
    put:
      tags: [auth]
      summary: Change the password and sign out all other sessions
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangePasswordRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  # ---------------------------------------------------------------- backup
  /api/notifications/settings:
    get:
      tags: [notifications]
      summary: ntfy notification settings (the token is never returned)
      responses: { "200": { description: OK } }
    put:
      tags: [notifications]
      summary: Save notification settings; an empty token keeps the stored one
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, serverUrl: { type: string }, topic: { type: string }, token: { type: string }, rules: { type: object, properties: { services: { type: boolean }, containers: { type: boolean }, disk: { type: boolean }, diskThreshold: { type: number, minimum: 50, maximum: 99 }, tls: { type: boolean }, tlsDays: { type: integer, minimum: 1, maximum: 90 }, backups: { type: boolean } } } } } } } }
      responses: { "200": { description: OK }, "422": { description: Validation error } }
  /api/notifications/test:
    post:
      tags: [notifications]
      summary: Send a test message
      responses: { "204": { description: Sent }, "503": { description: ntfy server not reachable } }
  /api/notifications/channels:
    get:
      tags: [notifications]
      summary: Additional channels (Gotify, webhook, e-mail) without secrets
      responses: { "200": { description: OK } }
    post:
      tags: [notifications]
      summary: Add a channel with minimum importance and optional alert types
      responses: { "200": { description: Created } }
  /api/notifications/channels/{id}:
    put:
      tags: [notifications]
      summary: Update a channel (empty secret keeps the stored one)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }
    delete:
      tags: [notifications]
      summary: Delete a channel
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /api/notifications/channels/{id}/test:
    post:
      tags: [notifications]
      summary: Send a test message through one channel
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Sent } }
  /api/notifications/maintenance:
    get:
      tags: [notifications]
      summary: Active and upcoming maintenance windows
      responses: { "200": { description: "List of {id, scope, start, end, note}" } }
    post:
      tags: [notifications]
      summary: "Start a maintenance window: {scope: [\"service:NAS\", \"container:x\" or \"*\"], minutes | start+end, note}"
      responses: { "201": { description: Created } }
  /api/notifications/maintenance/{id}:
    delete:
      tags: [notifications]
      summary: End an active window now or remove a planned one
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Ended } }
  /api/backup-status/sources:
    get:
      tags: [backup-status]
      summary: Monitored backup sources with state ok | overdue | failed | waiting
      responses: { "200": { description: OK } }
    post:
      tags: [backup-status]
      summary: Create a source; the response contains the ping URL once
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, maxAgeHours: { type: number, minimum: 1, maximum: 1440 } } } } } }
      responses: { "201": { description: Created (source + pingUrl) }, "422": { description: Validation error } }
  /api/backup-status/sources/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      tags: [backup-status]
      summary: Rename or change the maximum age
      responses: { "200": { description: OK }, "404": { description: Not found } }
    delete:
      tags: [backup-status]
      summary: Delete a source
      responses: { "204": { description: Deleted }, "404": { description: Not found } }
  /api/backup-status/sources/{id}/token:
    post:
      tags: [backup-status]
      summary: Generate a new ping URL; the old one stops working
      responses: { "200": { description: OK (source + pingUrl) } }
  /api/checks/ping/{token}/{event}:
    post:
      tags: [backupmonitor]
      summary: "Heartbeat ping with event start (job began, measures duration) or fail (body: message); GET works too. /api/backup-status/ping/... is an alias"
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }, { name: event, in: path, required: true, schema: { type: string, enum: [start, fail] } }]
      responses: { "204": { description: Recorded }, "404": { description: Unknown token } }
  /api/backup-status/ping/{token}:
    post:
      tags: [backup-status]
      summary: Report a backup run (no session; the secret token authenticates). Body is an optional message.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ok, fail] } }
      responses: { "204": { description: Recorded }, "404": { description: Unknown token } }
  /api/backups:
    get:
      tags: [backup]
      summary: Stored database backups
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BackupFile" } } } } }
    post:
      tags: [backup]
      summary: Create a backup now (old ones are pruned per BACKUP_RETENTION)
      security: [{ session: [], csrf: [] }]
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/BackupFile" } } } }
  /api/backups/{name}:
    get:
      tags: [backup]
      summary: Download a backup (SQLite database file)
      parameters: [{ name: name, in: path, required: true, schema: { type: string, pattern: '^trisse-home-\d{8}-\d{6}\.db$' } }]
      responses:
        "200": { description: SQLite database, content: { application/vnd.sqlite3: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- onboarding
  /api/onboarding:
    get:
      tags: [onboarding]
      summary: Whether the guided tour has been completed
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Onboarding" } } } }
    put:
      tags: [onboarding]
      summary: Complete (true) or restart (false) the guided tour
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Onboarding" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Onboarding" } } } }

  /api/auth/totp:
    get:
      tags: [auth]
      summary: Two-factor authentication status
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, recoveryCodesLeft: { type: integer } } } } } }
  /api/auth/totp/setup:
    post:
      tags: [auth]
      summary: Start connecting an authenticator app (secret is pending until confirmed)
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { secret: { type: string }, uri: { type: string, description: otpauth:// URI for the QR code } } } } } }
        "409": { description: Already enabled, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/auth/totp/confirm:
    post:
      tags: [auth]
      summary: Confirm with a code; enables 2FA and returns 10 one-time recovery codes (shown once)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { codes: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/totp/disable:
    post:
      tags: [auth]
      summary: Turn off 2FA (requires password and a current or recovery code)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password, code], properties: { password: { type: string }, code: { type: string } } } } } }
      responses:
        "204": { description: Disabled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/oidc/start:
    get:
      tags: [auth]
      summary: Redirect to the OpenID provider (sets a short-lived state cookie); 404 when OIDC is not configured
      security: []
      responses: { "302": { description: Redirect to the provider } }
  /api/auth/oidc/callback:
    get:
      tags: [auth]
      summary: Return from the provider; sets the session cookie and redirects to / (or /?sso_error=… / /?sso_ticket=…)
      security: []
      responses: { "302": { description: Redirect into the app } }
  /api/auth/sso/header:
    post:
      tags: [auth]
      summary: Sign in with the user header of a trusted proxy (AUTH_PROXY_HEADER, only from TRUSTED_PROXIES)
      security: []
      responses: { "200": { description: Session started }, "202": { description: "Local code required: {ticket}" }, "403": { description: User not allowed }, "404": { description: Not configured or not from a trusted proxy } }
  /api/auth/sso/2fa:
    post:
      tags: [auth]
      summary: Finish an SSO sign-in with the local TOTP or recovery code (SSO_REQUIRE_2FA)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { ticket: { type: string }, code: { type: string } } } } } }
      responses: { "200": { description: Session started } }
  /api/auth/passkeys:
    get:
      tags: [auth]
      summary: Passkeys of the signed-in account and whether passkeys are available (needs PUBLIC_URL)
      responses: { "200": { description: "{available, passkeys: [{id, name, createdAt, lastUsedAt}]}" } }
  /api/auth/passkeys/register/begin:
    post:
      tags: [auth]
      summary: Parameters for navigator.credentials.create() (base64url challenge, rpId, userId, excludeCredentials)
      responses: { "200": { description: OK } }
  /api/auth/passkeys/register/finish:
    post:
      tags: [auth]
      summary: Store a passkey from the browser's attestation (base64url clientDataJSON, attestationObject); returns recovery codes when first issued
      responses: { "201": { description: "{passkey, recoveryCodes}" } }
  /api/auth/passkeys/{id}:
    delete:
      tags: [auth]
      summary: Remove a passkey of the signed-in account
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Removed } }
  /api/auth/passkeys/login:
    post:
      tags: [auth]
      summary: Second login step - the ticket from the 202 login answer plus the signed assertion (base64url)
      security: []
      responses: { "200": { description: Session started }, "401": { description: Rejected or ticket expired } }
  /api/auth/tokens:
    get:
      tags: [auth]
      summary: List personal API tokens without their secrets (owner session only)
      responses: { "200": { description: "List of {id, name, scopes, createdAt, expiresAt, lastUsedAt, lastUsedIp}" } }
    post:
      tags: [auth]
      summary: Create a token with scopes such as todos:write; the secret (th_…) is returned once. See docs/api-tokens.md
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, scopes: { type: array, items: { type: string } }, expiresInDays: { type: integer } } } } } }
      responses: { "201": { description: "Created, includes token" }, "422": { description: Invalid name or scopes } }
  /api/auth/tokens/{id}:
    delete:
      tags: [auth]
      summary: Revoke a token
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Revoked } }
  /api/auth/guests:
    get:
      tags: [auth]
      summary: List read-only guest accounts (owner only)
      responses: { "200": { description: "List of {id, name, tabs, disabled, createdAt}" }, "403": { description: Not the owner } }
    post:
      tags: [auth]
      summary: Create a guest with name, password and shared tab IDs (owner only)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, password: { type: string }, tabs: { type: array, items: { type: string } } } } } } }
      responses: { "201": { description: Created }, "409": { description: Name taken }, "422": { description: Invalid name or password } }
  /api/auth/guests/{id}:
    put:
      tags: [auth]
      summary: Change shared tabs, disable/enable, or set a new password (empty keeps it); disabling or a new password ends the guest's sessions
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }
    delete:
      tags: [auth]
      summary: Delete a guest and its sessions
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /api/auth/events:
    get:
      tags: [auth]
      summary: Security log of the last 90 days (sign-ins, failures, lockouts, new devices, password and 2FA changes, data imports), newest first
      responses: { "200": { description: "List of {id, at, type, accountId, ip, userAgent, detail}" } }
  /api/auth/sessions:
    get:
      tags: [auth]
      summary: Active sessions of the account (current one marked)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } } } } }
  /api/auth/sessions/revoke-others:
    post:
      tags: [auth]
      summary: Sign out every session except the current one
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { revoked: { type: integer } } } } } }
  /api/auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Sign out one session
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Signed out }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- dashboard
  /api/dashboard:
    get:
      tags: [dashboard]
      summary: All tabs with their widgets (creates a default tab on first use)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
  /api/dashboard/tabs:
    post:
      tags: [dashboard]
      summary: Create a tab
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TabName" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Tab" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/dashboard/tabs/order:
    put:
      tags: [dashboard]
      summary: Reorder tabs (must list every tab once)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TabOrder" } } } }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/dashboard/tabs/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [dashboard]
      summary: Rename a tab
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TabName" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tab" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [dashboard]
      summary: Delete a tab and its widgets
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The last tab cannot be deleted, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/dashboard/tabs/{id}/widgets:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [dashboard]
      summary: Add a widget to a tab
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddWidget" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Widget" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/dashboard/tabs/{id}/layout:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [dashboard]
      summary: Store widget positions of a tab
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Layout" } } } }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/dashboard/tabs/{id}/background:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [dashboard]
      summary: Set the background image of a tab (http(s) URL; empty = global background)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { background: { type: string } } } } } }
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" }, "422": { description: Invalid URL } }
  /api/dashboard/templates:
    get:
      tags: [dashboard]
      summary: Tab templates
      security: [{ session: [] }]
      responses: { "200": { description: "OK (id, name, widgets, kinds)" } }
    post:
      tags: [dashboard]
      summary: Save the widgets of a tab as a template
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { tabId: { type: string }, name: { type: string, maxLength: 40 } } } } } }
      responses: { "201": { description: Created }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Too many templates } }
  /api/dashboard/templates/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      tags: [dashboard]
      summary: Delete a template
      security: [{ session: [], csrf: [] }]
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/dashboard/templates/{id}/tabs:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [dashboard]
      summary: Create a tab from a template (empty name = template name); widgets of disabled modules are skipped
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses: { "201": { description: Created }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/dashboard/widgets/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [dashboard]
      summary: Replace a widget's configuration
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WidgetConfig" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Widget" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [dashboard]
      summary: Remove a widget
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- appearance
  /api/appearance:
    get:
      tags: [appearance]
      summary: Visual preferences
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
    put:
      tags: [appearance]
      summary: Save visual preferences
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  # ---------------------------------------------------------------- search
  /api/search:
    get:
      tags: [search]
      summary: Redirect to the search result page (custom shortcuts, URLs, default provider)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 1000 } }
      responses:
        "302": { description: Redirect to the provider, headers: { Location: { schema: { type: string, format: uri } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/search/opensearch.xml:
    get:
      tags: [search]
      summary: OpenSearch description for browsers (public)
      security: []
      responses:
        "200": { description: OK, content: { application/opensearchdescription+xml: { schema: { type: string } } } }
  /api/search/settings:
    get:
      tags: [search]
      summary: Default provider, available providers and custom shortcuts
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
    put:
      tags: [search]
      summary: Choose the default provider
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DefaultProvider" } } } }
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/search/shortcuts:
    post:
      tags: [search]
      summary: Add a custom shortcut such as !gh
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Shortcut" } } } }
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
        "409": { description: Keyword already used, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/search/shortcuts/{keyword}:
    delete:
      tags: [search]
      summary: Delete a custom shortcut
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: keyword, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- weather
  /api/weather:
    get:
      tags: [weather]
      summary: Current weather and forecast (cached, refreshed every 15 minutes)
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Forecast" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /api/weather/warnings:
    get:
      tags: [weather]
      summary: Official DWD warnings for the location (empty outside Germany), most severe first; cached 5 minutes
      parameters: [{ name: lat, in: query, required: true, schema: { type: number } }, { name: lon, in: query, required: true, schema: { type: number } }]
      responses: { "200": { description: OK }, "422": { description: Invalid coordinates }, "503": { description: DWD not reachable } }
  /api/weather/radar:
    get:
      tags: [weather]
      summary: PNG of the DWD precipitation radar (≈220 km around the location, Germany only); cached 5 minutes
      parameters: [{ name: lat, in: query, required: true, schema: { type: number } }, { name: lon, in: query, required: true, schema: { type: number } }]
      responses:
        "200": { description: OK, content: { image/png: { schema: { type: string, format: binary } } } }
        "422": { description: Outside Germany or invalid coordinates }
  /api/weather/places:
    get:
      tags: [weather]
      summary: Search places by name (geocoding)
      parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Place" } } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  # ---------------------------------------------------------------- services
  /api/services:
    get:
      tags: [services]
      summary: Service tiles with their latest health check
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Service" } } } } }
    post:
      tags: [services]
      summary: Add a service (checked immediately)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Service" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/services/check:
    post:
      tags: [services]
      summary: Check all services now
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Service" } } } } }
  /api/services/{id}/wake:
    post:
      tags: [services]
      summary: Send a Wake-on-LAN magic packet to the service's MAC address (directly or via the wol-relay)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Sent }
        "400": { description: No MAC address stored }
        "503": { description: The relay did not answer (profile "wol" not enabled) }
  /api/services/uptime:
    get:
      tags: [services]
      summary: Uptime per service in percent over 24 h, 7, 30 and 90 days plus 90 daily values (null without data); maintenance windows are excluded
      responses: { "200": { description: OK } }
  /api/services/incidents:
    get:
      tags: [services]
      summary: Outages, newest first (?service=<id>&limit=<n>); open incidents have end null
      responses: { "200": { description: OK } }
  /api/services/history:
    get:
      tags: [services]
      summary: Response time history per service ID (kept 24 h)
      parameters: [{ name: hours, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 24 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, additionalProperties: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, latencyMs: { type: number }, online: { type: boolean } } } } } } } }
  /api/services/order:
    put:
      tags: [services]
      summary: Reorder services (must list every service once)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/IdList" } } } }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/services/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [services]
      summary: Update a service
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Service" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [services]
      summary: Delete a service
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- bookmarks
  /api/bookmarks:
    get:
      tags: [bookmarks]
      summary: Bookmarks matching a filter, plus all folders and tags
      parameters:
        - { name: folder, in: query, schema: { type: string }, description: 'Folder ID, or "none" for bookmarks without folder' }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Text search in title, URL and description }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BookmarkList" } } } }
    post:
      tags: [bookmarks]
      summary: Create a bookmark
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BookmarkInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Bookmark" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/bookmarks/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [bookmarks]
      summary: Update a bookmark
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BookmarkInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Bookmark" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [bookmarks]
      summary: Delete a bookmark
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/bookmarks/import:
    post:
      tags: [bookmarks]
      summary: Import a browser bookmark export (Netscape HTML, max. 8 MB); folders are kept as "Parent / Child", existing URLs and non-http(s) links are skipped
      requestBody: { required: true, content: { text/html: { schema: { type: string } } } }
      responses:
        "200": { description: "Counts (created, skippedInvalid, skippedExists, foldersCreated)" }
        "422": { description: No bookmarks found or file too large }
  /api/bookmarks/folders:
    post:
      tags: [bookmarks]
      summary: Create a folder
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Name" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Folder" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/bookmarks/folders/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [bookmarks]
      summary: Rename a folder
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Name" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Folder" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [bookmarks]
      summary: Delete a folder (its bookmarks are kept without folder)
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- notes
  /api/notes:
    get:
      tags: [notes]
      summary: Notes, pinned first
      parameters: [{ name: pinned, in: query, schema: { type: boolean } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Note" } } } } }
    post:
      tags: [notes]
      summary: Create a note
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoteInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/notes/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [notes]
      summary: One note
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [notes]
      summary: Update a note
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoteInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [notes]
      summary: Delete a note
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- metrics
  /metrics:
    get:
      tags: [system]
      summary: Prometheus text exposition (only with METRICS_ENABLED=true; Authorization Bearer METRICS_TOKEN), see docs/metrics.md
      security: []
      responses: { "200": { description: "text/plain; version=0.0.4" }, "401": { description: Missing or wrong token } }

  # ---------------------------------------------------------------- speedtest
  /api/speedtest/settings:
    get:
      tags: [speedtest]
      summary: Speedtest Tracker connection and thresholds (the token is never returned)
      responses: { "200": { description: "{configured, url, hasToken, minDownMbps, minUpMbps}" } }
    put:
      tags: [speedtest]
      summary: Test and save the connection; an empty token keeps the stored one, thresholds of 0 are off
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { url: { type: string }, token: { type: string }, minDownMbps: { type: number }, minUpMbps: { type: number } } } } } }
      responses: { "200": { description: OK }, "422": { description: Invalid or not reachable } }
  /api/speedtest/results:
    get:
      tags: [speedtest]
      summary: Latest result and history in Mbit/s and ms (?hours=24|168, default 168; cached, refreshed every 10 minutes)
      responses: { "200": { description: "{latest, history, updatedAt, error}" }, "404": { description: Not configured } }

  # ---------------------------------------------------------------- timeline
  /api/timeline:
    get:
      tags: [timeline]
      summary: Timeline events, newest first (?source=&severity=info|warning|critical&before=<RFC 3339>&limit=)
      responses: { "200": { description: "List of {id, at, source, severity, subject, message}" } }
  /api/timeline/settings:
    get:
      tags: [timeline]
      summary: Retention of the timeline in days
      responses: { "200": { description: OK } }
    put:
      tags: [timeline]
      summary: Set the retention (1-365 days)
      responses: { "200": { description: OK }, "422": { description: Invalid } }

  # ---------------------------------------------------------------- todos
  /api/todos:
    get:
      tags: [todos]
      summary: Open to-dos (and completed ones with done=true)
      parameters: [{ name: done, in: query, schema: { type: boolean } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Todo" } } } } }
    post:
      tags: [todos]
      summary: Create a to-do
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/todos/clear-completed:
    post:
      tags: [todos]
      summary: Delete all completed to-dos
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { removed: { type: integer } }, required: [removed] } } } }
  /api/todos/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [todos]
      summary: Update text, due date and completion
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [todos]
      summary: Delete a to-do
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- rss
  /api/rss/feeds:
    get:
      tags: [rss]
      summary: Subscribed feeds with unread counts
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Feed" } } } } }
    post:
      tags: [rss]
      summary: Subscribe to a feed (fetched immediately)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { url: { type: string, format: uri } }, required: [url] } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Feed" } } } }
        "409": { description: Already subscribed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/rss/feeds/{id}:
    delete:
      tags: [rss]
      summary: Unsubscribe and delete the feed's items
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/rss/items:
    get:
      tags: [rss]
      summary: Items, newest first
      parameters:
        - { name: feed, in: query, schema: { type: string } }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FeedItem" } } } } }
  /api/rss/items/{id}/read:
    put:
      tags: [rss]
      summary: Set the read state of an item
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { read: { type: boolean } }, required: [read] } } } }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/rss/read-all:
    post:
      tags: [rss]
      summary: Mark all items (of one feed) as read
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { feedId: { type: string, description: Empty for all feeds } }, required: [feedId] } } } }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/rss/refresh:
    post:
      tags: [rss]
      summary: Fetch all feeds now
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Feed" } } } } }

  # ---------------------------------------------------------------- system, docker
  /api/system:
    get:
      tags: [system]
      summary: Host metrics (sampled every 5 seconds)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SystemSnapshot" } } } }
        "502": { $ref: "#/components/responses/Unavailable" }
  /api/system/version:
    get:
      tags: [system]
      summary: Running version and, if the opt-in update check is enabled, the latest release (looked up at most once a day)
      responses: { "200": { description: "OK (current, checkEnabled, latest, updateAvailable)" } }
  /api/system/update-check:
    put:
      tags: [system]
      summary: Enable or disable the daily update check against the GitHub releases API (default off)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean } } } } } }
      responses: { "200": { description: OK } }
  /api/system/forecast-settings:
    get:
      tags: [system]
      summary: Disk forecast window and warning threshold in days (defaults 14/14)
      responses: { "200": { description: "{windowDays, alertDays}" } }
    put:
      tags: [system]
      summary: Set the forecast window (3-90 days) and warning threshold (1-365 days)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { windowDays: { type: integer }, alertDays: { type: integer } } } } } }
      responses: { "200": { description: OK }, "422": { description: Invalid } }
  /api/system/history:
    get:
      tags: [system]
      summary: Metric history (one point per minute, kept 24 h, downsampled to max. 288 points)
      parameters: [{ name: hours, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 24 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, cpu: { type: number }, memory: { type: number }, disk: { type: number } } } } } } }
  /api/docker/containers:
    get:
      tags: [docker]
      summary: Containers via the read-only socket proxy (refreshed every 20 seconds)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ContainerList" } } } }
  /api/docker/actions:
    get:
      tags: [docker]
      summary: Whether container actions are enabled (DOCKER_ACTIONS) and for which containers
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, containers: { type: array, items: { type: string } } } } } } }
  /api/docker/containers/{name}/restart:
    post:
      tags: [docker]
      summary: Restart a container on the allow-list (through the restart-only proxy)
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Restarted }, "403": { description: Actions disabled or container not allowed } }
  /api/docker/containers/{name}/logs:
    get:
      tags: [docker]
      summary: Last 200 log lines of a container on the allow-list
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { lines: { type: array, items: { type: string } } } } } } }
        "403": { description: Actions disabled or container not allowed }

  # ---------------------------------------------------------------- transfer
  /api/transfer/export:
    get:
      tags: [transfer]
      summary: Download all user data (layout, bookmarks, notes, to-dos, feeds, services, settings) as a versioned JSON file; never contains secrets
      responses: { "200": { description: "Export file (format trisse-home-export, version, exportedAt, sections)" } }
  /api/transfer/import:
    post:
      tags: [transfer]
      summary: Import an export file (max. 16 MB). Each contained section replaces the module's data atomically; sections of disabled modules are skipped
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { format: { type: string, enum: [trisse-home-export] }, version: { type: integer }, sections: { type: object } } } } } }
      responses:
        "200": { description: "Result (imported, skipped, failed with reasons)" }
        "422": { description: Not an export file, unsupported version or too large }

  # ---------------------------------------------------------------- nextcloud
  /api/nextcloud/settings:
    get:
      tags: [nextcloud]
      summary: Connection settings (the app password is never returned)
      responses: { "200": { description: OK } }
    put:
      tags: [nextcloud]
      summary: Test and save the connection; an empty app password keeps the stored one
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { url: { type: string }, username: { type: string }, appPassword: { type: string } } } } } }
      responses: { "200": { description: OK }, "422": { description: Validation error or connection failed } }
  /api/nextcloud/status:
    get:
      tags: [nextcloud]
      summary: Version, maintenance mode, the account's quota and (for admins with the serverinfo app) server details; refreshed every 5 minutes
      responses:
        "200": { description: "OK; server is null and serverHint explains why when serverinfo is unavailable" }
        "404": { description: Not configured }

  # ---------------------------------------------------------------- fritzbox
  /api/fritzbox/settings:
    get:
      tags: [fritzbox]
      summary: Connection settings (the password is never returned)
      responses: { "200": { description: OK } }
    put:
      tags: [fritzbox]
      summary: Test and save; username/password are optional (needed for calls and link speed), an empty password keeps the stored one
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { url: { type: string, example: "http://192.168.178.1:49000" }, username: { type: string }, password: { type: string } } } } } }
      responses: { "200": { description: OK }, "422": { description: Validation error, box not reachable or login failed } }
  /api/fritzbox/status:
    get:
      tags: [fritzbox]
      summary: WAN state, external IP, throughput (bytes/s via UPnP), link speed and recent calls (via TR-064); refreshed every 15 s, calls every 2 min
      responses: { "200": { description: OK }, "404": { description: Not configured } }

  # ---------------------------------------------------------------- parcels
  /api/parcels/settings:
    get:
      tags: [parcels]
      summary: Tracking settings (the DHL API key is never returned)
      responses: { "200": { description: OK } }
    put:
      tags: [parcels]
      summary: Save the DHL API key (encrypted; empty keeps the stored one) and how long delivered parcels stay visible
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { dhlApiKey: { type: string }, hideDeliveredDays: { type: integer, minimum: 0, maximum: 30 } } } } } }
      responses: { "200": { description: OK }, "422": { description: Validation error } }
  /api/parcels:
    get:
      tags: [parcels]
      summary: Tracked parcels (undelivered first); refreshed hourly in the background
      responses: { "200": { description: OK } }
    post:
      tags: [parcels]
      summary: Track a parcel (carrier dhl); it is queried immediately when a key is configured
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { trackingNumber: { type: string }, carrier: { type: string, enum: [dhl] }, label: { type: string, maxLength: 60 } } } } } }
      responses: { "201": { description: Created }, "409": { description: Too many parcels }, "422": { description: Validation error } }
  /api/parcels/{id}:
    delete:
      tags: [parcels]
      summary: Stop tracking a parcel
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted }, "404": { description: Not found } }

  # ---------------------------------------------------------------- transit
  /api/transit/stops:
    get:
      tags: [transit]
      summary: Search stops (MOTIS geocoding, default Transitous)
      parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 2 } }]
      responses: { "200": { description: OK }, "503": { description: Provider not reachable } }
  /api/transit/departures:
    get:
      tags: [transit]
      summary: Next departures of a stop with real-time delay; cached one minute per stop
      parameters:
        - { name: stop, in: query, required: true, schema: { type: string } }
        - { name: n, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 1 } }
      responses: { "200": { description: OK }, "422": { description: Invalid stop }, "503": { description: Provider not reachable } }

  # ---------------------------------------------------------------- shopping
  /api/shopping/settings:
    get:
      tags: [shopping]
      summary: CalDAV task list settings (the password is never returned)
      responses: { "200": { description: OK } }
    put:
      tags: [shopping]
      summary: Test and save the task list; an empty password keeps the stored one
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { listUrl: { type: string }, username: { type: string }, password: { type: string } } } } } }
      responses: { "200": { description: OK }, "422": { description: Validation error or list not readable } }
  /api/shopping/items:
    get:
      tags: [shopping]
      summary: Open items (oldest first) and the ten most recently completed ones, read live from the task list
      responses: { "200": { description: OK }, "404": { description: Not configured }, "503": { description: Task list not reachable } }
    post:
      tags: [shopping]
      summary: Add an item (VTODO via CalDAV PUT with If-None-Match)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { summary: { type: string, maxLength: 200 } } } } } }
      responses: { "201": { description: Created }, "422": { description: Validation error } }
  /api/shopping/items/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: CalDAV object name (….ics) }]
    put:
      tags: [shopping]
      summary: Check or uncheck an item; only the completion properties change, written with If-Match
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { done: { type: boolean } } } } } }
      responses: { "204": { description: Saved }, "404": { description: Not found }, "409": { description: Changed in another app meanwhile } }
    delete:
      tags: [shopping]
      summary: Delete an item
      responses: { "204": { description: Deleted }, "404": { description: Not found } }
  /api/shopping/clear-completed:
    post:
      tags: [shopping]
      summary: Delete all completed items
      responses: { "200": { description: "Number of deleted items ({deleted})" } }

  # ---------------------------------------------------------------- waste
  /api/waste/settings:
    get:
      tags: [waste]
      summary: ICS subscription and custom rules
      responses: { "200": { description: OK } }
    put:
      tags: [waste]
      summary: Load (test) and save the ICS subscription (https, http or webcal) and rules
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { url: { type: string }, rules: { type: array, maxItems: 20, items: { type: object, properties: { match: { type: string }, label: { type: string }, color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }, icon: { type: string } } } } } } } } }
      responses: { "200": { description: OK }, "422": { description: Validation error or calendar not loadable } }
  /api/waste/upcoming:
    get:
      tags: [waste]
      summary: Next three dates per waste type, ordered by the next collection (refreshed every 6 hours)
      responses: { "200": { description: OK }, "404": { description: Not configured } }

  # ---------------------------------------------------------------- diskhealth
  /api/diskhealth:
    get:
      tags: [diskhealth]
      summary: S.M.A.R.T. health per disk from the export of scripts/smart-export.sh
      description: >
        Status ok|warning|critical|unknown with findings, temperature, power-on hours, reallocated and pending
        sectors (ATA) and wear (NVMe). Exports older than DISKHEALTH_STALE_AFTER are unknown.
      responses: { "200": { description: List of disks }, "404": { description: No export found } }

  # ---------------------------------------------------------------- wireguard
  /api/wireguard/peers:
    get:
      tags: [wireguard]
      summary: Peers from the export of scripts/wireguard-export.sh (online = handshake within 3 minutes; stale = export older than 5 minutes)
      responses: { "200": { description: OK }, "404": { description: No export found } }
  /api/wireguard/names:
    put:
      tags: [wireguard]
      summary: Set a custom name for a public key (empty name removes it)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { publicKey: { type: string }, name: { type: string, maxLength: 40 } } } } } }
      responses: { "204": { description: Saved }, "422": { description: Validation error } }

  # ---------------------------------------------------------------- adguard
  /api/adguard/settings:
    get:
      tags: [adguard]
      summary: Connection settings (the password is never returned)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdGuardSettings" } } } }
    put:
      tags: [adguard]
      summary: Test and save the connection (empty password keeps the stored one)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdGuardSettingsInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdGuardSettings" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/adguard/stats:
    get:
      tags: [adguard]
      summary: Cached statistics (refreshed every minute)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdGuardStats" } } } }
        "404": { description: Not configured, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ---------------------------------------------------------------- calendar
  /api/calendar/settings:
    get:
      tags: [calendar]
      summary: CalDAV settings (the password is never returned)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSettings" } } } }
    put:
      tags: [calendar]
      summary: Test and save the CalDAV connection (empty password keeps the stored one)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSettingsInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSettings" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/calendar/events:
    get:
      tags: [calendar]
      summary: Upcoming events (cached, refreshed every 15 minutes) or, with from/to, the events of a period of at most 42 days (month view)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 31, default: 7 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Agenda" } } } }
        "404": { description: Not configured, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { description: Invalid period, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    post:
      tags: [calendar]
      summary: Create an event in one of the configured calendars (CalDAV PUT with If-None-Match)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calendarUrl, summary, start, end]
              properties:
                calendarUrl: { type: string, description: One of the configured calendar URLs }
                summary: { type: string, maxLength: 200 }
                location: { type: string, maxLength: 200 }
                allDay: { type: boolean }
                start: { type: string, description: "RFC 3339 instant, or YYYY-MM-DD for all-day events" }
                end: { type: string, description: "RFC 3339 instant, or YYYY-MM-DD (inclusive) for all-day events" }
      responses:
        "201": { description: Created }
        "422": { description: Validation error or unknown calendar, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "503": { description: The calendar server rejected the event, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: trisse_session
      description: HttpOnly, SameSite=Strict session cookie (`__Host-trisse_session` with COOKIE_SECURE=true).
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Per-session CSRF token, required for state-changing requests.
    apiToken:
      type: http
      scheme: bearer
      description: Personal API token (th_…) with module scopes such as todos:write; no CSRF token needed. Cannot reach /api/auth. See docs/api-tokens.md.
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    Session: { description: Session started; the cookie is set, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
    SearchSettings: { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SearchSettings" } } } }
    Unauthorized: { description: Missing or invalid session or credentials, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    Invalid: { description: Validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    TooManyRequests: { description: Too many failed attempts, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    Unavailable: { description: Upstream service unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bad_request, invalid, not_found, conflict, unauthorized, forbidden, too_many_requests, unavailable, internal] }
            message: { type: string }
            field: { type: string }
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        userAgent: { type: string }
        clientIp: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
    BackupFile: { type: object, properties: { name: { type: string }, size: { type: integer }, createdAt: { type: string, format: date-time } } }
    Onboarding: { type: object, required: [completed], properties: { completed: { type: boolean } } }
    Health: { type: object, properties: { status: { type: string, enum: [ok, unavailable] } } }
    ModulesInfo:
      type: object
      required: [modules, widgetKinds]
      properties:
        modules: { type: array, items: { type: string } }
        widgetKinds: { type: array, items: { type: string } }
    AuthStatus:
      type: object
      required: [setupRequired, authenticated]
      properties:
        setupRequired: { type: boolean }
        authenticated: { type: boolean }
        csrfToken: { type: string }
    Session:
      type: object
      required: [csrfToken, expiresAt]
      properties:
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    SetupRequest:
      type: object
      required: [setupToken, password]
      properties:
        setupToken: { type: string }
        password: { type: string, minLength: 12, maxLength: 256 }
    LoginRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }
        code: { type: string, description: TOTP or recovery code; required when 2FA is enabled (otherwise 422 with field "totpCode") }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12, maxLength: 256 }
    Name: { type: object, required: [name], properties: { name: { type: string } } }
    IdList: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } }
    TabName: { type: object, required: [name], properties: { name: { type: string, maxLength: 40 } } }
    TabOrder: { type: object, required: [tabIds], properties: { tabIds: { type: array, items: { type: string } } } }
    Dashboard: { type: object, required: [tabs], properties: { tabs: { type: array, items: { $ref: "#/components/schemas/Tab" } } } }
    Tab:
      type: object
      required: [id, name, position, widgets]
      properties:
        id: { type: string }
        name: { type: string }
        position: { type: integer }
        widgets: { type: array, items: { $ref: "#/components/schemas/Widget" } }
    Rect:
      type: object
      required: [x, y, w, h]
      properties:
        x: { type: integer, minimum: 0, maximum: 11 }
        y: { type: integer, minimum: 0, maximum: 500 }
        w: { type: integer, minimum: 1, maximum: 12 }
        h: { type: integer, minimum: 1, maximum: 24 }
    Widget:
      allOf:
        - $ref: "#/components/schemas/Rect"
        - type: object
          required: [id, tabId, kind, config]
          properties:
            id: { type: string }
            tabId: { type: string }
            kind: { type: string, examples: [clock, search, weather, services, bookmarks, notes, todos, rss, calendar, system, docker, adguard] }
            config: { type: object, additionalProperties: true }
    AddWidget:
      allOf:
        - $ref: "#/components/schemas/Rect"
        - type: object
          required: [kind]
          properties:
            kind: { type: string }
            config: { type: object, additionalProperties: true }
    WidgetConfig: { type: object, required: [config], properties: { config: { type: object, additionalProperties: true } } }
    Layout:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { allOf: [{ $ref: "#/components/schemas/Rect" }, { type: object, required: [id], properties: { id: { type: string } } }] }
    Appearance:
      type: object
      required: [theme, accentColor, backgroundImage, customCss]
      properties:
        theme: { type: string, enum: [system, light, dark] }
        accentColor: { type: string, description: '#rrggbb or empty', pattern: '^(#[0-9a-fA-F]{6})?$' }
        backgroundImage: { type: string, description: http(s) URL or empty }
        customCss: { type: string, maxLength: 65536 }
    SearchSettings:
      type: object
      required: [defaultProvider, providers, shortcuts]
      properties:
        defaultProvider: { type: string, examples: [duckduckgo] }
        providers: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } }
        shortcuts: { type: array, items: { $ref: "#/components/schemas/Shortcut" } }
    DefaultProvider: { type: object, required: [defaultProvider], properties: { defaultProvider: { type: string } } }
    Shortcut:
      type: object
      required: [keyword, name, urlTemplate]
      properties:
        keyword: { type: string, pattern: '^!?[a-z0-9]{1,16}$' }
        name: { type: string }
        urlTemplate: { type: string, description: 'http(s) URL containing {query}' }
    Forecast:
      type: object
      properties:
        lat: { type: number }
        lon: { type: number }
        timezone: { type: string }
        temperature: { type: number }
        apparentTemperature: { type: number }
        humidity: { type: number }
        windSpeed: { type: number }
        weatherCode: { type: integer, description: WMO weather code }
        isDay: { type: boolean }
        updatedAt: { type: string, format: date-time }
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              temperatureMin: { type: number }
              temperatureMax: { type: number }
              weatherCode: { type: integer }
              precipitationProbability: { type: number }
    Place:
      type: object
      properties: { name: { type: string }, region: { type: string }, country: { type: string }, lat: { type: number }, lon: { type: number } }
    ServiceInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 60 }
        url: { type: string, format: uri }
        checkUrl: { type: string, description: Defaults to url }
        icon: { type: string, description: Emoji, text or http(s) image URL }
        description: { type: string, maxLength: 200 }
        skipTlsVerify: { type: boolean }
        mac: { type: string, description: "MAC address for Wake-on-LAN, normalised to aa:bb:cc:dd:ee:ff; empty for none" }
    Service:
      allOf:
        - $ref: "#/components/schemas/ServiceInput"
        - type: object
          properties:
            id: { type: string }
            position: { type: integer }
            state: { type: string, enum: [online, offline, unknown] }
            httpStatus: { type: integer }
            latencyMs: { type: integer }
            checkedAt: { type: string, format: date-time }
            error: { type: string }
            certExpiresAt: { type: [string, "null"], format: date-time }
            certExpiresSoon: { type: boolean, description: TLS certificate expires within 14 days }
    BookmarkInput:
      type: object
      required: [url]
      properties:
        folderId: { type: string }
        title: { type: string, maxLength: 200 }
        url: { type: string, format: uri }
        description: { type: string, maxLength: 1000 }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } }
    Bookmark:
      allOf:
        - $ref: "#/components/schemas/BookmarkInput"
        - type: object
          properties: { id: { type: string }, createdAt: { type: string, format: date-time } }
    Folder: { type: object, properties: { id: { type: string }, name: { type: string }, position: { type: integer }, count: { type: integer } } }
    BookmarkList:
      type: object
      properties:
        bookmarks: { type: array, items: { $ref: "#/components/schemas/Bookmark" } }
        folders: { type: array, items: { $ref: "#/components/schemas/Folder" } }
        tags: { type: array, items: { type: object, properties: { name: { type: string }, count: { type: integer } } } }
    NoteInput:
      type: object
      required: [title, body, pinned]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, description: Markdown, maxLength: 102400 }
        pinned: { type: boolean }
    Note:
      allOf:
        - $ref: "#/components/schemas/NoteInput"
        - type: object
          properties: { id: { type: string }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    TodoInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 300 }
        due: { type: string, description: YYYY-MM-DD or empty }
        done: { type: boolean }
    Todo:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        due: { type: string }
        done: { type: boolean }
        overdue: { type: boolean }
        position: { type: integer }
        completedAt: { type: string }
    Feed:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        title: { type: string }
        siteUrl: { type: string }
        lastError: { type: string }
        lastFetchedAt: { type: [string, "null"], format: date-time }
        unread: { type: integer }
    FeedItem:
      type: object
      properties:
        id: { type: string }
        feedId: { type: string }
        feedTitle: { type: string }
        title: { type: string }
        link: { type: string, description: http(s) link or empty }
        publishedAt: { type: string, format: date-time }
        read: { type: boolean }
    Usage: { type: object, properties: { total: { type: integer }, used: { type: integer }, percent: { type: number } } }
    SystemSnapshot:
      type: object
      properties:
        cpuPercent: { type: number }
        cpuCount: { type: integer }
        load: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        memory: { $ref: "#/components/schemas/Usage" }
        swap: { $ref: "#/components/schemas/Usage" }
        disks:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              usage: { $ref: "#/components/schemas/Usage" }
              forecast:
                type: object
                nullable: true
                description: Disk forecast from daily aggregates (null before the first aggregate)
                properties:
                  status: { type: string, enum: [filling, flat, insufficient] }
                  daysUntilFull: { type: number }
                  bytesPerDay: { type: number }
                  confidence: { type: number, description: R² of the regression (0-1) }
        uptimeSeconds: { type: integer }
        temperature: { type: number, description: °C, 0 if unknown }
        takenAt: { type: string, format: date-time }
    ContainerList:
      type: object
      properties:
        containers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              image: { type: string }
              state: { type: string }
              status: { type: string }
              health: { type: string, enum: [none, healthy, unhealthy, starting] }
              project: { type: string }
              created: { type: string, format: date-time }
        total: { type: integer }
        running: { type: integer }
        stopped: { type: integer }
        unhealthy: { type: integer }
        updatedAt: { type: string, format: date-time }
        error: { type: string }
    AdGuardSettings:
      type: object
      properties: { configured: { type: boolean }, url: { type: string }, username: { type: string }, hasPassword: { type: boolean } }
    AdGuardSettingsInput:
      type: object
      required: [url, username, password]
      properties: { url: { type: string }, username: { type: string }, password: { type: string, description: Empty keeps the stored password } }
    AdGuardStats:
      type: object
      properties:
        queries: { type: integer }
        blocked: { type: integer }
        blockedPercent: { type: number }
        avgProcessingMs: { type: number }
        protectionEnabled: { type: boolean }
        topBlocked: { type: array, items: { type: object, properties: { domain: { type: string }, count: { type: integer } } } }
        updatedAt: { type: string, format: date-time }
        error: { type: string }
    CalendarSettings:
      type: object
      properties:
        configured: { type: boolean }
        calendarUrls: { type: array, items: { type: string } }
        username: { type: string }
        hasPassword: { type: boolean }
    CalendarSettingsInput:
      type: object
      required: [calendarUrls, username, password]
      properties:
        calendarUrls: { type: array, maxItems: 10, items: { type: string, format: uri } }
        username: { type: string }
        password: { type: string, description: App password; empty keeps the stored one }
    Agenda:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              uid: { type: string }
              summary: { type: string }
              location: { type: string }
              calendar: { type: string }
              start: { type: string, description: RFC 3339, or YYYY-MM-DD for all-day events }
              end: { type: string, description: RFC 3339, or YYYY-MM-DD (exclusive) for all-day events }
              allDay: { type: boolean }
        updatedAt: { type: string, format: date-time }
        error: { type: string }

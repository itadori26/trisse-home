tags:
  - name: countdown

paths:
  /api/countdowns:
    get:
      tags: [countdown]
      summary: "Countdowns sorted by their end (#54); past ones stay visible for graceDays full days (0–365, default 1)"
      parameters: [{ name: graceDays, in: query, schema: { type: integer, minimum: 0, maximum: 365, default: 1 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Countdown" } } } } }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      tags: [countdown]
      summary: Create a countdown
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CountdownInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Countdown" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/countdowns/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [countdown]
      summary: Change title, emoji, date and time
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CountdownInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Countdown" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [countdown]
      summary: Delete a countdown
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

schemas:
  CountdownInput:
    type: object
    required: [title, date]
    properties:
      title: { type: string, maxLength: 120 }
      emoji: { type: string, maxLength: 8, description: Optional single emoji }
      date: { type: string, format: date, description: YYYY-MM-DD }
      time: { type: string, description: "HH:MM, or empty for the whole day" }
  Countdown:
    allOf:
      - { $ref: "#/components/schemas/CountdownInput" }
      - type: object
        required: [id, createdAt]
        properties:
          id: { type: string }
          createdAt: { type: string, format: date-time }

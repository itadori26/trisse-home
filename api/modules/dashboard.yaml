tags:
  - name: dashboard

paths:
  /api/dashboard:
    get:
      tags: [dashboard]
      summary: All tabs with their widgets and the default tab by rules (creates a default tab on first use)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
  /api/dashboard/tabs:
    post:
      tags: [dashboard]
      summary: Create a tab
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TabName" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Tab" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/dashboard/tabs/order:
    put:
      tags: [dashboard]
      summary: Reorder tabs (must list every tab once)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TabOrder" } } } }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/dashboard/tabs/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [dashboard]
      summary: Rename a tab
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TabName" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tab" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [dashboard]
      summary: Delete a tab and its widgets
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The last tab cannot be deleted, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/dashboard/tabs/{id}/widgets:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [dashboard]
      summary: Add a widget to a tab
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddWidget" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Widget" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/dashboard/tabs/{id}/layout:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [dashboard]
      summary: Store widget positions of a tab
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Layout" } } } }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/dashboard/tabs/{id}/background:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [dashboard]
      summary: "Set the background of a tab: an http(s) image URL, an uploaded picture (/api/appearance/backgrounds/<id>) or builtin:<name>; empty = the background of all tabs"
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { background: { type: string } } } } } }
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" }, "422": { description: Invalid URL } }
  /api/dashboard/tabs/{id}/zones:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [dashboard]
      summary: Lay a tab out in the zones Today, My things and System, or in the free grid again; widgets keep their grid places
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tab" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/dashboard/tabs/{id}/rules:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [dashboard]
      summary: Set the rules that open a tab by default (at most 10; the first tab with a matching rule wins)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [rules], properties: { rules: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/TabRule" } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tab" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/dashboard/tabs/{id}/mobile-layout:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [dashboard]
      summary: Store the phone layout of a tab (order, hidden on phones, height); widgets left out are appended
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/MobileItem" } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tab" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [dashboard]
      summary: Reset the phone layout so it follows the desktop grid again
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tab" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/dashboard/templates:
    get:
      tags: [dashboard]
      summary: Tab templates
      security: [{ session: [] }]
      responses: { "200": { description: "OK (id, name, widgets, kinds)" } }
    post:
      tags: [dashboard]
      summary: Save the widgets of a tab as a template
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { tabId: { type: string }, name: { type: string, maxLength: 40 } } } } } }
      responses: { "201": { description: Created }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Too many templates } }
  /api/dashboard/templates/builtin:
    get:
      tags: [dashboard]
      summary: "Templates that ship with Waylight (#589): family, homelab, wall tablet, work. Each names what it needs before applying (location) and its widgets with their cells for a preview; clients translate the title by id."
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, title, needs, widgets]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    needs: { type: array, items: { type: string, enum: [location] } }
                    widgets:
                      type: array
                      items: { type: object, required: [kind, x, y, w, h], properties: { kind: { type: string }, x: { type: integer }, y: { type: integer }, w: { type: integer }, h: { type: integer } } }
  /api/dashboard/templates/builtin/{id}/tabs:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [dashboard]
      summary: "Create a tab from a built-in template with its phone layout (empty name = template name); widgets of disabled modules are skipped; location fills the weather widgets"
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                location:
                  type: object
                  required: [lat, lon]
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lon: { type: number, minimum: -180, maximum: 180 }
                    label: { type: string }
                    placeId: { type: string, description: Saved place (#591) }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Tab" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/dashboard/sample:
    delete:
      tags: [dashboard]
      summary: "Remove the account's example tabs from the setup (#670), e.g. when the template choice on first start replaces them or the user starts empty; with no tab left the next load creates the default tab"
      security: [{ session: [], csrf: [] }]
      responses: { "204": { description: Removed } }
  /api/dashboard/sample/keep:
    post:
      tags: [dashboard]
      summary: "Keep the account's example tabs from the setup as ordinary tabs (#670)"
      security: [{ session: [], csrf: [] }]
      responses: { "204": { description: Kept } }
  /api/dashboard/templates/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      tags: [dashboard]
      summary: Delete a template
      security: [{ session: [], csrf: [] }]
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/dashboard/templates/{id}/tabs:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [dashboard]
      summary: Create a tab from a template (empty name = template name); widgets of disabled modules are skipped
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses: { "201": { description: Created }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/dashboard/widgets/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [dashboard]
      summary: Replace a widget's configuration
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WidgetConfig" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Widget" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [dashboard]
      summary: Remove a widget
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

schemas:
  TabName: { type: object, required: [name], properties: { name: { type: string, maxLength: 40 } } }
  TabOrder: { type: object, required: [tabIds], properties: { tabIds: { type: array, items: { type: string } } } }
  Dashboard:
    type: object
    required: [tabs, defaultTabId]
    properties:
      tabs: { type: array, items: { $ref: "#/components/schemas/Tab" } }
      defaultTabId: { type: string, description: 'Tab whose rules match the server time and the client address; "" = keep the last used tab' }
      clientNetwork: { type: string, description: 'Private network of the client (CIDR, /24 or /64) for an "in this network" rule; absent for public or unknown addresses' }
  MobileItem:
    type: object
    required: [id, hidden, rows]
    properties:
      id: { type: string, description: Widget ID }
      hidden: { type: boolean, description: Hidden on phones only }
      rows: { type: integer, minimum: 1, maximum: 24, description: Minimum height in grid rows, used while no size is set }
      size: { type: string, enum: [small, medium, large, strip], description: "Size on the phone grid of four columns (#585): small 2×2, medium 4×2, large 4×4, strip 4×1; omitted for full width" }
  TabRule:
    type: object
    description: Opens a tab by default. Empty parts always match; a range like 22:00–02:00 runs over midnight and belongs to the weekday it starts on.
    properties:
      days: { type: array, maxItems: 7, items: { type: integer, minimum: 0, maximum: 6 }, description: Weekdays, 0 = Sunday }
      from: { type: string, example: "07:00", description: HH:MM, empty together with `to` = whole day }
      to: { type: string, example: "09:30" }
      networks: { type: array, maxItems: 10, items: { type: string, example: 192.168.178.0/24 }, description: CIDR ranges matched against the client address }
  Tab:
    type: object
    required: [id, name, position, widgets]
    properties:
      id: { type: string }
      name: { type: string }
      position: { type: integer }
      background: { type: string }
      rules: { type: array, items: { $ref: "#/components/schemas/TabRule" } }
      widgets: { type: array, items: { $ref: "#/components/schemas/Widget" } }
      mobile: { type: array, items: { $ref: "#/components/schemas/MobileItem" }, description: Phone layout in display order (derived from the desktop grid until edited) }
      mobileCustom: { type: boolean, description: "false = the phone layout follows the desktop grid" }
      zoned: { type: boolean, description: "true = the tab is laid out in zones instead of the free grid" }
      sample: { type: boolean, description: "true = an example tab from the setup that the template choice on first start replaces (#670); omitted otherwise" }
  Widget:
    allOf:
      - $ref: "#/components/schemas/Rect"
      - type: object
        required: [id, tabId, kind, config]
        properties:
          id: { type: string }
          tabId: { type: string }
          kind: { type: string, examples: [clock, search, weather, services, bookmarks, notes, todos, rss, calendar, system, docker, adguard] }
          config: { type: object, additionalProperties: true }
          size: { type: string, enum: [small, medium, large, strip], description: "Size on the web grid (#595): small and strip show the compact view, medium and large the full view; omitted for a freely sized tile" }
          zone: { type: string, enum: [today, mine, system], description: "Zone on a zoned tab; omitted while the client picks one by the widget's kind" }
  AddWidget:
    allOf:
      - $ref: "#/components/schemas/Rect"
      - type: object
        required: [kind]
        properties:
          kind: { type: string }
          config: { type: object, additionalProperties: true }
          size: { type: string, enum: [small, medium, large, strip], description: "Size on the web grid (#595): small and strip show the compact view, medium and large the full view; omitted for a freely sized tile" }
  WidgetConfig: { type: object, required: [config], properties: { config: { type: object, additionalProperties: true } } }
  Layout:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          allOf:
            - $ref: "#/components/schemas/Rect"
            - type: object
              required: [id]
              properties:
                id: { type: string }
                size: { type: string, enum: ["", small, medium, large, strip], description: 'New web size (#595); "" makes the tile freely sized again, omitted keeps the stored size' }
                zone: { type: string, enum: ["", today, mine, system], description: 'New zone on a zoned tab; "" picks one by kind again, omitted keeps the stored zone' }

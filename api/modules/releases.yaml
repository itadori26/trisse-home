tags:
  - name: releases

paths:
  /api/releases:
    get:
      tags: [releases]
      summary: New releases of followed artists, newest first (refreshed every 6 hours)
      parameters: [{ name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 4 } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  releases: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string }, artist: { type: string }, type: { type: string }, date: { type: string, format: date } } } }
                  updatedAt: { type: string, format: date-time }
                  error: { type: string }
  /api/releases/search:
    get:
      tags: [releases]
      summary: Search MusicBrainz artists (at least two characters)
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReleaseArtist" } } } } }
  /api/releases/artists:
    get:
      tags: [releases]
      summary: Followed artists
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReleaseArtist" } } } } }
    post:
      tags: [releases]
      summary: Follow an artist (at most 50); its releases are loaded right away
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } } } } }
      responses:
        "204": { description: Followed }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/releases/artists/{id}:
    delete:
      tags: [releases]
      summary: Unfollow an artist
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Unfollowed }
  /api/releases/covers/{id}:
    get:
      tags: [releases]
      summary: Front cover (250 px) of a listed release, proxied from the Cover Art Archive
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Image, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { description: Not a listed release or no cover, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

schemas:
  ReleaseArtist:
    type: object
    properties:
      id: { type: string }
      name: { type: string }
      disambiguation: { type: string }

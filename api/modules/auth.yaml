paths:
  /api/auth/status:
    get:
      tags: [auth]
      summary: Setup and login state of the caller (public)
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatus" } } } }
  /api/auth/setup:
    post:
      tags: [auth]
      summary: Create the account with the setup token from the server log (public)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetupRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { description: Invalid setup token, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: Already set up, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/demo:
    post:
      tags: [auth]
      summary: Password-less login, only routed when DEMO_MODE=true (see docs/demo.md); /api/auth/status reports demo=true
      security: []
      responses: { "200": { description: Session started }, "404": { description: Not a demo instance } }
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in (public, rate limited per client IP)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Setup required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Logged out }
  /api/auth/password:
    put:
      tags: [auth]
      summary: Change the password and sign out all other sessions
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangePasswordRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/auth/kiosk/login:
    post:
      tags: [auth]
      summary: Sign a kiosk display in with the token of its link (public, rate limited like the login); the page reads the token from the URL fragment, so it never reaches server logs (#50)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { description: Unknown, renewed or disabled link, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/kiosk:
    get:
      tags: [auth]
      summary: Display options of the signed-in kiosk (rotation, night dimming)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KioskOptions" } } } }
        "404": { description: Not a kiosk session }
  /api/auth/kiosks:
    get:
      tags: [auth]
      summary: Kiosk displays (owner only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KioskDisplay" } } } } }
    post:
      tags: [auth]
      summary: Create a kiosk display; the link token is returned once and stored hashed
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KioskRequest" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { kiosk: { $ref: "#/components/schemas/KioskDisplay" }, token: { type: string } } } } } }
        "409": { description: At most 10 displays }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/auth/kiosks/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      tags: [auth]
      summary: Change tabs, options or the disabled flag (disabling signs the device out)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KioskRequest" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KioskDisplay" } } } }
        "404": { description: Unknown display }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [auth]
      summary: Delete a display and sign the device out
      security: [{ session: [], csrf: [] }]
      responses: { "204": { description: Deleted }, "404": { description: Unknown display } }
  /api/auth/kiosks/{id}/link:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [auth]
      summary: Replace the link; the old link and the device's session stop working
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
        "404": { description: Unknown display }

schemas:
  AuthStatus:
    type: object
    required: [setupRequired, authenticated]
    properties:
      setupRequired: { type: boolean }
      authenticated: { type: boolean }
      csrfToken: { type: string }
  SetupRequest:
    type: object
    required: [setupToken, password]
    properties:
      setupToken: { type: string }
      password: { type: string, minLength: 12, maxLength: 256 }
  LoginRequest:
    type: object
    required: [password]
    properties:
      password: { type: string }
      code: { type: string, description: TOTP or recovery code; required when 2FA is enabled (otherwise 422 with field "totpCode") }
  ChangePasswordRequest:
    type: object
    required: [currentPassword, newPassword]
    properties:
      currentPassword: { type: string }
      newPassword: { type: string, minLength: 12, maxLength: 256 }
  KioskOptions:
    type: object
    properties:
      rotateSeconds: { type: integer, description: "Seconds per tab, 10-3600; 0 = no rotation" }
      nightFrom: { type: string, example: "22:00", description: "HH:MM, empty = never dimmed" }
      nightTo: { type: string, example: "06:30" }
  KioskRequest:
    allOf:
      - $ref: "#/components/schemas/KioskOptions"
      - type: object
        properties:
          name: { type: string, description: 2-32 lowercase letters, digits, dots, dashes or underscores }
          tabs: { type: array, items: { type: string }, minItems: 1 }
          disabled: { type: boolean }
  KioskDisplay:
    allOf:
      - $ref: "#/components/schemas/KioskOptions"
      - type: object
        properties:
          id: { type: string }
          name: { type: string }
          tabs: { type: array, items: { type: string } }
          disabled: { type: boolean }
          createdAt: { type: string, format: date-time }
          lastUsedAt: { type: string, format: date-time, nullable: true }

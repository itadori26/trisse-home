tags:
  - name: notes

paths:
  /api/notes:
    get:
      tags: [notes]
      summary: Notes, pinned first
      parameters: [{ name: pinned, in: query, schema: { type: boolean } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Note" } } } } }
    post:
      tags: [notes]
      summary: Create a note
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoteInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/notes/search:
    get:
      tags: [notes]
      summary: Full-text search (FTS5, prefix match, diacritics folded); highlighted title and excerpt as text segments
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Best matches first (at most 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: array, items: { $ref: "#/components/schemas/TextSegment" } }
                    snippet: { type: array, items: { $ref: "#/components/schemas/TextSegment" } }
  /api/notes/{id}/backlinks:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [notes]
      summary: "Notes that link to this one with [[Title]]"
      responses:
        "200": { description: "OK (id, title)" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/notes/{id}/revisions:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [notes]
      summary: Earlier versions, newest first (one per 10 minutes of editing, at most 50)
      responses:
        "200": { description: "OK (id, title, createdAt, size)" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/notes/{id}/revisions/{rev}:
    parameters: [{ $ref: "#/components/parameters/id" }, { name: rev, in: path, required: true, schema: { type: string } }]
    get:
      tags: [notes]
      summary: A version with its text and a line diff to the current note (op " ", "+", "-")
      responses:
        "200": { description: "OK (id, title, createdAt, size, body, diff)" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/notes/{id}/revisions/{rev}/restore:
    parameters: [{ $ref: "#/components/parameters/id" }, { name: rev, in: path, required: true, schema: { type: string } }]
    post:
      tags: [notes]
      summary: Restore a version; the current text is kept as a version
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: The restored note }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/notes/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [notes]
      summary: One note
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [notes]
      summary: Update a note
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoteInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [notes]
      summary: Delete a note
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

schemas:
  TextSegment: { type: object, properties: { text: { type: string, description: Plain text, never HTML }, hit: { type: boolean } } }
  NoteInput:
    type: object
    required: [title, body, pinned]
    properties:
      title: { type: string, maxLength: 200 }
      body: { type: string, description: Markdown, maxLength: 102400 }
      pinned: { type: boolean }
  Note:
    allOf:
      - $ref: "#/components/schemas/NoteInput"
      - type: object
        properties: { id: { type: string }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }

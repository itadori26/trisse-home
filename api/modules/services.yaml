tags:
  - name: services

paths:
  /api/services:
    get:
      tags: [services]
      summary: Service tiles with their latest health check
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Service" } } } } }
    post:
      tags: [services]
      summary: Add a service (checked immediately)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Service" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/services/check:
    post:
      tags: [services]
      summary: Check all services now
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Service" } } } } }
  /api/services/{id}/wake:
    post:
      tags: [services]
      summary: Send a Wake-on-LAN magic packet to the service's MAC address (directly or via the wol-relay)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Sent }
        "400": { description: No MAC address stored }
        "503": { description: The relay did not answer (profile "wol" not enabled) }
  /api/services/uptime:
    get:
      tags: [services]
      summary: Uptime per service in percent over 24 h, 7, 30 and 90 days plus 90 daily values (null without data); maintenance windows are excluded
      responses: { "200": { description: OK } }
  /api/services/incidents:
    get:
      tags: [services]
      summary: Outages, newest first (?service=<id>&limit=<n>); open incidents have end null
      responses: { "200": { description: OK } }
  /api/services/history:
    get:
      tags: [services]
      summary: Response time history per service ID (kept 24 h)
      parameters: [{ name: hours, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 24 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, additionalProperties: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, latencyMs: { type: number }, online: { type: boolean } } } } } } } }
  /api/services/order:
    put:
      tags: [services]
      summary: Reorder services (must list every service once)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/IdList" } } } }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/services/discovery:
    get:
      tags: [services]
      summary: Docker autodiscovery settings and the result of the last sync (#78)
      security: [{ session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Discovery" } } } }
    put:
      tags: [services]
      summary: Save the Docker autodiscovery settings
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DiscoveryInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Discovery" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/services/discovery/sync:
    post:
      tags: [services]
      summary: Read the container labels now and create, update or hide tiles
      description: A Docker API error is reported in `lastSync.error`, not as an HTTP error.
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Discovery" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/services/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [services]
      summary: Update a service
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Service" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [services]
      summary: Delete a service
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

schemas:
  IdList: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } }
  ServiceInput:
    type: object
    required: [name, url]
    properties:
      name: { type: string, maxLength: 60 }
      url: { type: string, format: uri }
      checkUrl: { type: string, description: Defaults to url }
      icon: { type: string, description: Emoji, text or http(s) image URL }
      description: { type: string, maxLength: 200 }
      skipTlsVerify: { type: boolean }
      mac: { type: string, description: "MAC address for Wake-on-LAN, normalised to aa:bb:cc:dd:ee:ff; empty for none" }
  Service:
    allOf:
      - $ref: "#/components/schemas/ServiceInput"
      - type: object
        properties:
          id: { type: string }
          position: { type: integer }
          state: { type: string, enum: [online, offline, unknown] }
          httpStatus: { type: integer }
          latencyMs: { type: integer }
          checkedAt: { type: string, format: date-time }
          error: { type: string }
          certExpiresAt: { type: [string, "null"], format: date-time }
          certExpiresSoon: { type: boolean, description: TLS certificate expires within 14 days }
          container: { type: string, description: Source container of a discovered tile, empty for manual tiles }
          hidden: { type: boolean, description: The container is gone; the tile is not shown on the dashboard }
  DiscoveryInput:
    type: object
    required: [enabled, intervalMinutes, rule]
    properties:
      enabled: { type: boolean }
      intervalMinutes: { type: integer, minimum: 1, maximum: 1440 }
      rule: { type: string, enum: [labels, manual], description: "labels: label values overwrite manual edits; manual: edited tiles are kept" }
  Discovery:
    allOf:
      - $ref: "#/components/schemas/DiscoveryInput"
      - type: object
        properties:
          available: { type: boolean, description: False when the docker module is disabled }
          lastSync:
            type: [object, "null"]
            properties:
              at: { type: string, format: date-time }
              error: { type: string }
              created: { type: integer }
              updated: { type: integer }
              hidden: { type: integer }
              shown: { type: integer }
              skipped: { type: integer, description: Containers with invalid labels }

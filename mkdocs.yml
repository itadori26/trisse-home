# Navigation of the documentation site (#268). The pages in docs/ are plain
# Markdown and read fine on GitHub; this file only adds the structure a site
# generator needs. It is built with Zensical, the successor of Material for
# MkDocs (in maintenance mode since November 2025), which reads this file
# as it is. Preview locally with:
#   pip install zensical && zensical serve
site_name: waylight
site_description: A self-hosted start page for your everyday life and your home server.
repo_url: https://github.com/Waylight-App/waylight
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Is it for me?:
      - What waylight is and is not: about.md

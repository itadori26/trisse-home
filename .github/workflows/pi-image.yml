name: Raspberry Pi image

# Builds the Raspberry Pi appliance image (ADR 0015) on a native arm64 runner,
# boots it in a container and checks the first-boot experience. Runs on pull
# requests that touch the image or the package, manually, and from the release
# workflow, which publishes the image to the release (publish: true).
on:
  pull_request:
    paths:
      - deploy/raspberrypi/**
      - packaging/**
      - .github/workflows/pi-image.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read

env:
  NFPM_VERSION: v2.47.0

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write # release upload, only with publish
      id-token: write # build provenance attestation, only with publish (#138)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the arm64 package
        id: pkg
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=${INPUT_VERSION:-$(sh scripts/package-version.sh)}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION"
          (cd web && npm ci --no-audit --no-fund)
          make package PKG_ARCHS=arm64 NFPM="$(go env GOPATH)/bin/nfpm" VERSION="$version" PKG_VERSION="$version"
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq systemd-container parted xz-utils jq >/dev/null
      - name: Build the image
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: sudo deploy/raspberrypi/build-image.sh dist/trisse-home_*_arm64.deb "$VERSION" dist/image
      - name: Boot the image and check the first-boot experience
        run: sudo NSPAWN_LOG="$RUNNER_TEMP/nspawn.log" deploy/raspberrypi/test-image.sh "$(cat deploy/raspberrypi/.work/last-image)"
      - name: Container console
        if: failure()
        run: sudo tail -n 200 "$RUNNER_TEMP/nspawn.log" || true
      - name: SBOM of the image
        run: |
          mkdir -p "$RUNNER_TEMP/pi-root"
          loop=$(sudo losetup --find --show --partscan --read-only "$(cat deploy/raspberrypi/.work/last-image)")
          sudo mount -o ro "${loop}p2" "$RUNNER_TEMP/pi-root"
          echo "PI_ROOT=$RUNNER_TEMP/pi-root" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ env.PI_ROOT }}
          format: spdx-json
          output-file: dist/image/trisse-home-${{ steps.pkg.outputs.version }}-raspberrypi-arm64.spdx.json
          upload-artifact: false
      - name: Summary
        run: |
          {
            echo "### Raspberry Pi image"
            echo
            echo "| File | Size |"
            echo "| --- | ---: |"
            for f in dist/image/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the image size budget (ADR 0011)
        run: go run ./scripts/budgets -pi-image dist/image/*.img.xz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raspberrypi-image
          path: dist/image/
          retention-days: 7
          compression-level: 0
      # Signed build provenance of the published image (#138), like the
      # container image: `gh attestation verify <img.xz> -R itadori26/trisse-home`.
      - name: Attest the build provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/image/*.img.xz
      - name: Attach the image to the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: gh release upload "v$VERSION" dist/image/* --clobber

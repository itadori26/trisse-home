name: Release

# A tag vX.Y.Z builds multi-arch images, pushes them to GHCR, smoke-tests the
# arm64 image under QEMU, attaches an SBOM and publishes a GitHub release with
# notes generated from Conventional Commits (scripts/release-notes.sh). The
# native .deb packages (amd64, arm64) are attached to the same release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Smoke-test both architectures
        run: |
          for arch in amd64 arm64; do
            out=$(docker run --rm --platform "linux/$arch" "$IMAGE@${{ steps.build.outputs.digest }}" version)
            echo "$arch: $out"
            test "$out" = "${{ steps.version.outputs.version }}"
          done

  release:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: trisse-home-${{ needs.image.outputs.version }}.spdx.json
          upload-artifact: false
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          printf '\n### Container image\n\n```\n%s:%s\n```\n' "$IMAGE" "${{ needs.image.outputs.version }}" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            "trisse-home-${{ needs.image.outputs.version }}.spdx.json"

  # Native .deb packages for amd64 and arm64 (ADR 0015), attached to the release.
  packages:
    runs-on: ubuntu-latest
    needs: [image, release]
    permissions:
      contents: write
    env:
      NFPM_VERSION: v2.47.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build packages
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION"
          (cd web && npm ci --no-audit --no-fund)
          make package NFPM="$(go env GOPATH)/bin/nfpm" VERSION="$VERSION" PKG_VERSION="$VERSION"
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256 --clobber

  screenshots:
    runs-on: ubuntu-latest
    needs: [image, release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the released image in demo mode
        run: |
          docker run -d --name demo --network host \
            -e DEMO_MODE=true -e LISTEN_ADDR=127.0.0.1:8090 -e ALLOWED_CIDRS=127.0.0.0/8 \
            -e SECRET_KEY="$(openssl rand -base64 32)" \
            "$IMAGE@${{ needs.image.outputs.digest }}"
          for i in $(seq 30); do curl -sf http://127.0.0.1:8090/healthz && break; sleep 1; done
      - name: Take screenshots
        working-directory: web
        env:
          SCREENSHOT_BASE_URL: http://127.0.0.1:8090
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run screenshots
      - name: Attach screenshots to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" docs/screenshots/*.png --clobber

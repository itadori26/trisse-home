name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build frontend placeholder
        run: mkdir -p internal/platform/webui/dist && touch internal/platform/webui/dist/.gitkeep
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test
        run: go test -race -count=1 ./...
      - name: Generated TypeScript types and backend messages are up to date
        run: |
          go install github.com/gzuidhof/tygo@latest
          tygo generate
          go run ./scripts/servermessages
          cd web && npm ci --no-audit --no-fund && npx prettier --write src/shared/api-client/generated >/dev/null
          git diff --exit-code -- src/shared/api-client/generated

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: make build
      - run: cd web && npx playwright test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t trisse-home:ci .
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Measure footprint (bundle, binary, image, idle memory)
        id: measure
        run: |
          docker build --target web -t trisse-home:web .
          web=$(docker create trisse-home:web) && docker cp "$web:/src/internal/platform/webui/dist" dist && docker rm "$web"
          app=$(docker create trisse-home:ci) && docker cp "$app:/trisse-home" trisse-home.bin && docker rm "$app"
          echo "image=$(docker image inspect -f '{{.Size}}' trisse-home:ci)" >> "$GITHUB_OUTPUT"
          docker run -d --name idle -e DEMO_MODE=true -e SECRET_KEY="$(openssl rand -base64 32)" trisse-home:ci
          sleep 60
          echo "memory=$(docker stats --no-stream --format '{{.MemUsage}}' idle)" >> "$GITHUB_OUTPUT"
          docker rm -f idle
      - name: Download the measurements of main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then gh run download "$id" -R "$GITHUB_REPOSITORY" -n budget-measurements -D baseline || true; fi
      - name: Check resource budgets
        run: |
          go run ./scripts/budgets -dist dist -binary trisse-home.bin \
            -image-bytes "${{ steps.measure.outputs.image }}" -memory "${{ steps.measure.outputs.memory }}" \
            -baseline baseline/measurements.json -out measurements.json
      - name: Keep the measurements for comparisons
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budget-measurements
          path: measurements.json
          retention-days: 90
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trisse-home:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload scan results
        if: always() && hashFiles('trivy.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trisse-home:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build frontend placeholder
        run: mkdir -p internal/platform/webui/dist && touch internal/platform/webui/dist/.gitkeep
      - name: govulncheck (fails on reachable vulnerabilities)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: npm audit (runtime dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

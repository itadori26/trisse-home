name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build frontend placeholder
        run: mkdir -p internal/platform/webui/dist && touch internal/platform/webui/dist/.gitkeep
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Test
        run: go test -race -count=1 ./...
      - name: Generated TypeScript types are up to date
        run: |
          go install github.com/gzuidhof/tygo@latest
          tygo generate
          cd web && npm ci --no-audit --no-fund && npx prettier --write src/shared/api-client/generated >/dev/null
          git diff --exit-code -- src/shared/api-client/generated

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: make build
      - run: cd web && npx playwright test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t trisse-home:ci .

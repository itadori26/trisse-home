name: Bug report
description: Something does not work as intended
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `docker compose exec trisse-home /trisse-home version`
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines (remove tokens, passwords and personal data).
      render: text

# Raspberry Pi image (ADR 0015).
[Service]
# Listening on port 80 is the only extra privilege.
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
# Image defaults go between the generated secrets and the admin's file, so
# that trisse-home.env still wins.
EnvironmentFile=
EnvironmentFile=-/etc/trisse-home/secret.env
EnvironmentFile=/etc/trisse-home/appliance.env
EnvironmentFile=/etc/trisse-home/trisse-home.env

# Generates TypeScript types from the Go DTOs (presenters and request DTOs).
# Run `make generate` after changing a DTO; the output is committed so the
# frontend can be built without a Go toolchain.
#
# This file lists only shared and irregular packages. Every module that
# follows the naming convention is added by scripts/tygoconfig (#193):
#   internal/modules/<m>/adapter/presenter          -> generated/<m>.ts
#   internal/modules/<m>/adapter/controller/dto.go  -> generated/<m>-requests.ts
# so a new module needs no edit here.
type_mappings:
  time.Time: "string /* RFC 3339 */"
packages:
  - path: "trisse-home/internal/modules"
    output_path: "web/src/shared/api-client/generated/modules.ts"
    include_files: ["dto.go"]
  - path: "trisse-home/internal/shared/httpapi"
    output_path: "web/src/shared/api-client/generated/httpapi.ts"
    include_files: ["errors.go"]
  - path: "trisse-home/internal/modules/transfer/adapter/controller"
    output_path: "web/src/shared/api-client/generated/transfer.ts"
    include_files: ["dto.go"]
  - path: "trisse-home/internal/modules/proxmox/adapter/controller"
    output_path: "web/src/shared/api-client/generated/proxmox-requests.ts"
